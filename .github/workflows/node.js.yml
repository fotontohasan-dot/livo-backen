name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/livo_test
      # postgres:16 সার্ভিস কন্টেইনারে SSL বন্ধ থাকে, তাই CI-তে প্লেইন TCP কানেকশন।
      # NODE_ENV=test হলে db.js এমনিতেই SSL বন্ধ করে; এখানে স্পষ্ট করে লেখা হলো যাতে
      # কনফিগারেশনটা ওয়ার্কফ্লো পড়েই বোঝা যায়।
      DATABASE_SSL: false
      SESSION_SECRET: test_secret_key_for_ci_only
      REDIS_ENABLED: false
      SSLCZ_IS_LIVE: false
      VAPID_SUBJECT: mailto:test@example.com
      FRONTEND_URL: http://localhost:4123

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build
