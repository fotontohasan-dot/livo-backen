version: '3.9'

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgres://livo:${DB_PASSWORD:-changeme}@db:5432/livo
  REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

services:
  app:
    build:
      context: .
      target: production
    container_name: livo-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livo-net
    volumes:
      - uploads_data:/app/public/uploads
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: livo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livo
      POSTGRES_USER: livo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livo -d livo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: livo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Monitoring — Prometheus + Grafana (ঐচ্ছিক, মূল app-এর উপর নির্ভর করে না) ====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: livo-prometheus
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./docker/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus
    # কন্টেইনার স্টার্ট হওয়ার সময় .env-এর METRICS_TOKEN template ফাইলে বসিয়ে আসল কনফিগ তৈরি হয় —
    # ম্যানুয়াল কোনো স্টেপ ছাড়াই /metrics স্ক্র্যাপ করার জন্য টোকেন সেট হয়ে যায়
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed 's#METRICS_TOKEN_PLACEHOLDER#'"$${METRICS_TOKEN}"'#' /etc/prometheus/prometheus.yml.template > /etc/prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    networks:
      - livo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: livo-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - livo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  livo-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backups_data:
  prometheus_data:
  grafana_data:
