version: '3.9'

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgres://livo:${DB_PASSWORD:-changeme}@db:5432/livo
  REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

services:
  app:
    build:
      context: .
      target: production
    container_name: livo-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livo-net
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: livo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livo
      POSTGRES_USER: livo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livo -d livo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: livo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  livo-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
