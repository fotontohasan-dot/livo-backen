version: '3.9'

services:
  app:
    build: .
    container_name: livo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livo-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: livo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livo
      POSTGRES_USER: livo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: livo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - livo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  livo-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: