version: '3.9'

services:
  app:
    build:
      context: .
      target: development
    container_name: livo-app-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://livo:${DB_PASSWORD:-changeme}@db:5432/livo
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nodemon", "app.js"]
