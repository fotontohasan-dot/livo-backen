services:
  # ---------------------------------------------------------------------------
  # 1. Livo Web Application (Stateless, Multi-Instance detrás Render Load Balancer)
  # ---------------------------------------------------------------------------
  - type: web
    name: livo-web
    env: node
    plan: starter # $7/month per instance
    numInstances: 2 # 2 instances for high availability and 1,000+ CCU target
    region: singapore # Closest low-latency region to Bangladesh / South Asia
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_POOL_MAX
        value: 10 # 2 instances * 10 = 20 DB connections max from web tier
      - key: DB_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_CONNECTION_TIMEOUT_MS
        value: 5000
      - key: DISABLE_BACKGROUND_WORKER
        value: "true" # Web instances serve HTTP/WebSocket only; worker handles jobs
      - key: SESSION_STORE_TYPE
        value: "redis" # Primary session store in Redis with PostgreSQL fallback
      - key: REDIS_URL
        fromService:
          type: redis
          name: livo-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: livo-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. Livo Background Worker (Dedicated Process for Cron, Sports Ingestion & Queues)
  # ---------------------------------------------------------------------------
  - type: worker
    name: livo-worker
    env: node
    plan: starter # $7/month
    region: singapore
    buildCommand: npm ci
    startCommand: node worker.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: 5 # 5 DB connections max for worker
      - key: REDIS_URL
        fromService:
          type: redis
          name: livo-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: livo-postgres
          property: connectionString

# ---------------------------------------------------------------------------
# 3. PostgreSQL Database (Authoritative Source of Truth)
# ---------------------------------------------------------------------------
databases:
  - name: livo-postgres
    plan: starter # $7/month, Starter PostgreSQL (up to 100 connections max)
    region: singapore
    postgresMajorVersion: 16

# ---------------------------------------------------------------------------
# 4. Redis Key-Value Store (Socket.IO Adapter, Session Store, Cache, Rate Limits)
# ---------------------------------------------------------------------------
redis:
  - name: livo-redis
    plan: starter # $7/month (256MB memory, high throughput)
    region: singapore
    maxmemoryPolicy: allkeys-lru
