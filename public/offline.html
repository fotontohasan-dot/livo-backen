<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন • Livo</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0f172a; color:#e2e8f0; font-family:'Segoe UI','Hind Siliguri',sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
    .box { max-width:320px; }
    .icon { font-size:48px; margin-bottom:12px; }
    h1 { font-size:18px; margin:0 0 8px; }
    p { font-size:13px; color:#94a3b8; margin:0 0 20px; }
    button { background:#f59e0b; color:#111; border:none; padding:12px 24px; border-radius:12px; font-weight:700; font-size:13px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনার ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
