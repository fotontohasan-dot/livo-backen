<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমন্ত্রণ শেয়ার করুন</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Bengali', Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 8px;
  }
  p.sub {
    text-align: center;
    color: #667085;
    font-size: 14px;
    margin: 0 0 20px;
  }
  label {
    font-size: 13px;
    color: #344054;
    display: block;
    margin: 12px 0 4px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  .share-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 4px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 12px;
    color: #fff;
    cursor: pointer;
    border: none;
  }
  .share-btn svg { width: 24px; height: 24px; fill: #fff; }
  .whatsapp { background: #25D366; }
  .messenger { background: #0084FF; }
  .facebook  { background: #1877F2; }
  .instagram { background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4); }
  .viber     { background: #7360F2; }
  .imo       { background: #23A2E1; }
  #status {
    text-align: center;
    font-size: 12px;
    color: #667085;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🎉 আমন্ত্রণ শেয়ার করুন</h1>
  <p class="sub">নিচে টেক্সট ও লিংক দিন, তারপর যেকোনো অ্যাপে শেয়ার করুন</p>

  <label for="msg">টেক্সট</label>
  <textarea id="msg">আপনাকে আন্তরিকভাবে আমন্ত্রণ জানানো হচ্ছে! বিস্তারিত জানতে লিংকে ক্লিক করুন 👇</textarea>

  <label for="link">লিংক</label>
  <input id="link" type="text" value="https://example.com/invitation">

  <div class="btn-grid">
    <a class="share-btn whatsapp" id="btnWhatsapp" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.15-4.94-4.34-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.28.58-.35.78-.35h.56c.18 0 .42-.02.65.5.24.53.82 1.86.9 2 .07.14.12.3.02.48-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.29.28-.12.55.16.28.72 1.19 1.55 1.93 1.07.95 1.97 1.25 2.24 1.39.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.33.07.12.07.68-.17 1.36z"/></svg>
      WhatsApp
    </a>
    <a class="share-btn messenger" id="btnMessenger" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.15 2 11.27c0 2.9 1.44 5.49 3.7 7.19V22l3.38-1.86c.9.25 1.86.38 2.92.38 5.52 0 10-4.15 10-9.27S17.52 2 12 2zm.99 12.46-2.55-2.72-4.98 2.72 5.48-5.82 2.61 2.72 4.92-2.72-5.48 5.82z"/></svg>
      Messenger
    </a>
    <a class="share-btn facebook" id="btnFacebook" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.16 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.45 2.91h-2.33V22c4.78-.78 8.44-4.94 8.44-9.94z"/></svg>
      Facebook
    </a>
    <a class="share-btn instagram" id="btnInstagram" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85C2.38 3.9 3.9 2.38 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zm0 5.84a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2zm5.2-6.76a.94.94 0 1 1-1.88 0 .94.94 0 0 1 1.88 0z"/></svg>
      Instagram
    </a>
    <a class="share-btn viber" id="btnViber" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12.03 2C6.93 2 3 5.5 3 10.2c0 2.86 1.5 5.4 3.86 6.98-.13 1.02-.5 2.7-.58 3.09-.1.48.18.47.38.34.15-.1 2.36-1.57 3.32-2.22.66.1 1.34.16 2.05.16 5.1 0 9.03-3.5 9.03-8.35C21 5.5 17.13 2 12.03 2zm4.87 10.66c-.15.4-.83.8-1.14.85-.29.05-.66.07-1.06-.06-.24-.08-.55-.18-.95-.35-1.67-.72-2.77-2.4-2.86-2.51-.08-.11-.68-.9-.68-1.72 0-.82.43-1.22.58-1.39.15-.16.33-.2.44-.2h.32c.1 0 .24-.01.37.29.15.31.5 1.07.55 1.15.04.08.07.17.01.28-.05.1-.08.17-.16.27-.08.09-.17.2-.24.27-.08.08-.17.16-.07.31.09.16.41.69.88 1.11.61.55 1.13.72 1.29.8.16.08.25.07.35-.04.09-.11.39-.45.5-.61.1-.16.21-.13.35-.08.15.05.92.43 1.08.51.16.08.26.12.3.19.04.07.04.39-.11.72z"/></svg>
      Viber
    </a>
    <a class="share-btn imo" id="btnImo" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-5.5 6.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm5.5 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm5.5 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
      imo
    </a>
  </div>

  <div id="status"></div>
</div>

<script>
  const msgEl = document.getElementById('msg');
  const linkEl = document.getElementById('link');

  const btnWhatsapp  = document.getElementById('btnWhatsapp');
  const btnMessenger = document.getElementById('btnMessenger');
  const btnFacebook  = document.getElementById('btnFacebook');
  const btnInstagram = document.getElementById('btnInstagram');
  const btnViber     = document.getElementById('btnViber');
  const btnImo       = document.getElementById('btnImo');
  const status       = document.getElementById('status');

  function updateLinks() {
    const text = msgEl.value.trim();
    const link = linkEl.value.trim();
    const combined = encodeURIComponent(text + ' ' + link);
    const encLink = encodeURIComponent(link);

    btnWhatsapp.href  = `https://wa.me/?text=${combined}`;
    btnFacebook.href  = `https://www.facebook.com/sharer/sharer.php?u=${encLink}`;
    btnMessenger.href = `fb-messenger://share/?link=${encLink}`;
    btnViber.href     = `viber://forward?text=${combined}`;
    btnImo.href       = `imo://send?text=${combined}`;

    btnInstagram.onclick = async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(text + ' ' + link);
        status.textContent = 'টেক্সট কপি হয়েছে — এখন Instagram-এ পেস্ট করুন';
      } catch {
        status.textContent = 'কপি করা যায়নি, ম্যানুয়ালি কপি করুন';
      }
      window.location.href = 'instagram://app';
    };
  }

  msgEl.addEventListener('input', updateLinks);
  linkEl.addEventListener('input', updateLinks);
  updateLinks();
</script>
</body>
</html>
