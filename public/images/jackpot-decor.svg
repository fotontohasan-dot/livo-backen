<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="gemGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B8A"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </radialGradient>
  </defs>

  <!-- coin stack -->
  <ellipse cx="55" cy="165" rx="42" ry="10" fill="#8A5F0C" opacity="0.35"/>
  <g>
    <ellipse cx="55" cy="158" rx="34" ry="9" fill="url(#coinGrad)" stroke="#8A5F0C" stroke-width="2"/>
    <ellipse cx="55" cy="150" rx="34" ry="9" fill="url(#coinGrad)" stroke="#8A5F0C" stroke-width="2"/>
    <ellipse cx="55" cy="142" rx="34" ry="9" fill="url(#coinGrad)" stroke="#8A5F0C" stroke-width="2"/>
    <ellipse cx="55" cy="142" rx="34" ry="9" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.6"/>
    <text x="55" y="147" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#8A5F0C" text-anchor="middle">$</text>
  </g>

  <!-- scattered small coins -->
  <ellipse cx="150" cy="168" rx="16" ry="6" fill="url(#coinGrad)" stroke="#8A5F0C" stroke-width="1.5"/>
  <ellipse cx="130" cy="175" rx="13" ry="5" fill="url(#coinGrad)" stroke="#8A5F0C" stroke-width="1.5"/>

  <!-- gem -->
  <g transform="translate(140,110)">
    <polygon points="0,-22 18,-6 11,20 -11,20 -18,-6" fill="url(#gemGrad)" stroke="#7a1010" stroke-width="1.5"/>
    <polygon points="0,-22 18,-6 0,-2" fill="#FF9AAE" opacity="0.55"/>
    <polygon points="-18,-6 0,-2 -11,20" fill="#8f0d1d" opacity="0.4"/>
  </g>

  <!-- crown -->
  <g transform="translate(100,55)">
    <path d="M -38 30 L -38 8 L -20 22 L -8 -8 L 0 10 L 8 -8 L 20 22 L 38 8 L 38 30 Z"
          fill="url(#goldGrad)" stroke="#8A5F0C" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-38" y="28" width="76" height="10" rx="3" fill="url(#goldGrad)" stroke="#8A5F0C" stroke-width="2"/>
    <circle cx="-20" cy="8" r="5" fill="#C8102E" stroke="#7a1010" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="5.5" fill="#C8102E" stroke="#7a1010" stroke-width="1.5"/>
    <circle cx="20" cy="8" r="5" fill="#C8102E" stroke="#7a1010" stroke-width="1.5"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFF3C4">
    <path d="M170 50 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3 z" opacity="0.9"/>
    <path d="M25 90 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2 z" opacity="0.8"/>
    <path d="M170 130 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2 z" opacity="0.7"/>
  </g>
</svg>
