<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livo - Live Casino & Sports</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #0b0b0c; 
            color: #fff; 
            margin: 0; 
            padding-bottom: 70px; 
        }
        .header { 
            background: #16171a; 
            padding: 15px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            color: #ff4d6d; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 100; 
        }
        .container { 
            padding: 75px 12px 20px 12px; 
            max-width: 450px; 
            margin: 0 auto; 
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { 
            background: #16171a; 
            border-radius: 15px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid #292a2d; 
        }
        .title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #ff4d6d; 
            margin-bottom: 8px; 
        }
        .btn { 
            background: #ff4d6d; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 8px; 
        }
        .game-btn { 
            background: #28a745; 
            color: white; 
            padding: 10px; 
            border-radius: 8px; 
            border: none; 
            margin: 5px 0; 
            width: 100%; 
            font-size: 15px;
        }
        .stream-box { 
            background: #000; 
            height: 320px; 
            border-radius: 12px; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        .stream-overlay { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: red; 
            padding: 4px 10px; 
            border-radius: 5px; 
            font-size: 12px; 
            font-weight: bold; 
        }
        .nav-bar { 
            background: #16171a; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            border-top: 1px solid #292a2d; 
        }
        .nav-item { 
            color: #888; 
            text-align: center; 
            background: none; 
            border: none; 
            font-size: 11px; 
        }
        .nav-item.active { color: #ff4d6d; font-weight: bold; }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="header" id="pageHeader">🏅 স্পোর্টস লাইভ</div>

    <div class="container">
        <!-- Sports Tab -->
        <div id="sports" class="tab-content active">
            <div class="card">
                <div class="title">⚽ রিয়াল মাদ্রিদ vs বার্সেলোনা</div>
                <button class="game-btn">মাদ্রিদ জিতবে (1.65)</button>
                <button class="game-btn">বার্সেলোনা জিতবে (2.80)</button>
            </div>
        </div>

        <!-- Casino Tab - নতুন গেম যোগ করা হয়েছে -->
        <div id="casino" class="tab-content">
            <div class="card">
                <div class="title">🎰 Teen Patti</div>
                <button class="btn" onclick="playGame('teenpatti')">খেলুন</button>
            </div>
            <div class="card">
                <div class="title">🃏 Andar Bahar</div>
                <button class="btn" onclick="playGame('andarbahar')">খেলুন</button>
            </div>
            <div class="card">
                <div class="title">🐉 Dragon Tiger</div>
                <button class="btn" onclick="playGame('dragontiger')">খেলুন</button>
            </div>
            <div class="card">
                <div class="title">🎰 Lucky Spin</div>
                <button class="btn" onclick="playGame('luckyspin')">স্পিন করুন</button>
            </div>
            <div class="card">
                <div class="title">🔥 Crash Game</div>
                <button class="btn" onclick="playGame('crash')">Crash খেলুন</button>
            </div>
            <div class="card">
                <div class="title">🎲 Roulette</div>
                <button class="btn" onclick="playGame('roulette')">রুলেট খেলুন</button>
            </div>
        </div>

        <!-- Live Stream Tab -->
        <div id="livestream" class="tab-content">
            <div class="stream-box">
                <div class="stream-overlay">LIVE</div>
                <div style="padding:20px; text-align:center;">
                    <h3>🔥 Neha_Live</h3>
                    <p>এখন লাইভ আছেন</p>
                </div>
            </div>
        </div>

        <!-- For You Tab -->
        <div id="foryou" class="tab-content">
            <div class="card">
                <h4 style="text-align:center;">🎬 হট রিলস ও ফটো</h4>
                <p style="text-align:center; color:#aaa;">আপনার জন্য ব্যক্তিগতকৃত কনটেন্ট</p>
            </div>
        </div>

        <!-- Profile Tab -->
        <div id="profile" class="tab-content">
            <div class="card" style="text-align:center;">
                <h2 id="userName">ইউজার</h2>
                <p>ব্যালেন্স: <span id="userBalance" style="color:#28a745; font-weight:bold;">0</span> কয়েন</p>
                <button class="btn" onclick="window.location.href='https://wa.me/966535743416'">💵 রিচার্জ করুন</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('sports', '🏅 স্পোর্টস লাইভ', this)"><span class="nav-icon">⚽</span>স্পোর্টস</button>
        <button class="nav-item" onclick="switchTab('casino', '🎰 ক্যাসিনো', this)"><span class="nav-icon">🎰</span>ক্যাসিনো</button>
        <button class="nav-item" onclick="switchTab('livestream', '🔥 লাইভ স্ট্রিম', this)"><span class="nav-icon">🎥</span>লাইভ</button>
        <button class="nav-item" onclick="switchTab('foryou', '✨ ফর ইউ', this)"><span class="nav-icon">📱</span>ফর ইউ</button>
        <button class="nav-item" onclick="switchTab('profile', '👤 প্রোফাইল', this)"><span class="nav-icon">👤</span>আমি</button>
    </div>

    <script>
        function switchTab(tabId, headerTitle, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('pageHeader').innerText = headerTitle;
            element.classList.add('active');
        }

        function playGame(game) {
            alert(game.toUpperCase() + " গেম শুরু হচ্ছে...\n\n(এখনো ডেমো মোডে আছে)");
        }

        // ডেমো ব্যালেন্স
        document.getElementById("userBalance").innerText = "12480";
    </script>
</body>
</html>
